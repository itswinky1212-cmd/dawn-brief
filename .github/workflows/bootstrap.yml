name: Bootstrap Dawn Brief

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project package
        run: |
          unzip -oq dawn-brief-site-84e9bfaf37ca47928323da62159b9d67.zip -d .
          rm dawn-brief-site-84e9bfaf37ca47928323da62159b9d67.zip
          rm .github/workflows/bootstrap.yml
          git config user.name "dawn-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Dawn Brief source"
          git push
